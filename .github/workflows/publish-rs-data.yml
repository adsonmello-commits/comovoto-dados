name: Publish official RS election data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-rs-data.yml
      - scripts/import_tse_rs.py
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: write

concurrency:
  group: publish-official-rs-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and validate official TSE archive
        run: python3 scripts/import_tse_rs.py

      - name: Commit validated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/2026/RS
          if git diff --cached --quiet; then
            echo "The TSE archive and manifest are already current."
          else
            git commit -m "Publish official TSE 2026 RS section results"
            git push
          fi
