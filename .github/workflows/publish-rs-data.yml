name: Publish official TSE election data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-rs-data.yml
      - scripts/import_tse_state.py
      - scripts/import_tse_presidencia.py
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: write

concurrency:
  group: publish-official-state-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and validate official TSE archive
        run: |
          python3 scripts/import_tse_state.py --state RS
          python3 scripts/import_tse_state.py --state SC
          python3 scripts/import_tse_state.py --state PR
          python3 scripts/import_tse_presidencia.py

      - name: Commit validated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026/RS data/2026/SC data/2026/PR data/2026/presidencia
          if git diff --cached --quiet; then
            echo "The TSE data are already current."
          else
            git commit -m "Publish official TSE 2026 election data"
            git pull --rebase origin main
            git push
          fi
